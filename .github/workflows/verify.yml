name: Verify prototype

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-regression:
    name: Windows / Python 3.12 / UI state
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - name: Set up Node for model-independent UI tests
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Install tested Windows dependencies
        run: python -m pip install -r requirements.lock.txt
      - name: Verify dependency compatibility
        run: python -m pip check
      - name: Check publication boundaries, links and source hashes
        run: python -m scripts.repository_check
      - name: Run Python regressions (deterministic model double)
        run: python -m pytest -q
      - name: Run UI state regressions
        run: node --test tests/ui_state.test.mjs
      - name: Check browser JavaScript syntax
        shell: pwsh
        run: |
          node --check app/static/app.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check app/static/hero.js
          exit $LASTEXITCODE
